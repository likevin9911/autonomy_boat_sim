local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 2
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 8
  height: 4.8
  resolution: 0.025
  transform_tolerance: 0.3
  
  plugins:
   - {name: static_layer,        type: "costmap_2d::StaticLayer"}
   - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
  
